name: Release

# Publishing is a tag push: `npm version <patch|minor|major> && git push --follow-tags`.
# The tag is the trigger, so a release always ships the exact commit it names.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC identity npm authenticates as. Trusted publishing exchanges it
      # for a short-lived credential, so no long-lived token exists to leak or
      # rotate, and the account's 2FA is never bypassed.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 bundles and
          # Node 22 does not. CI still builds on 22, the floor `engines` allows.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A release must resolve from the registry, never from a warm cache.
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Refuse to publish a tag that disagrees with the manifest, so the
      # registry version and the git tag can never drift apart.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
      # `prepack` builds, so the tarball carries lib/ and the installer never
      # compiles anything. Provenance is attached automatically under trusted
      # publishing — the `--provenance` flag is for token-authenticated runs.
      - run: npm publish --access public
