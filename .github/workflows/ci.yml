name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The published artifact must load with no compilation and no runtime
      # dependency beyond Node itself: a plugin that pulled in its own copy of
      # Cordis would give the host two Context classes and break service wiring.
      - name: Assert the built plugin has no external runtime imports
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs"
            const offenders = []
            for (const file of readdirSync("lib").filter(f => f.endsWith(".js"))) {
              const source = readFileSync(`lib/${file}`, "utf8")
              for (const [, specifier] of source.matchAll(/from\s+"([^"]+)"/g)) {
                if (!specifier.startsWith("node:") && !specifier.startsWith(".")) {
                  offenders.push(`${file} -> ${specifier}`)
                }
              }
            }
            if (offenders.length > 0) {
              console.error("external runtime imports:\n  " + offenders.join("\n  "))
              process.exit(1)
            }
            console.log("no external runtime imports")
          '
